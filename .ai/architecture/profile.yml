# ─────────────────────────────────────────────────────────────────────────────
# ARCHITECTURE PROFILE — single source of truth for every AI agent and for the
# architecture tests. Change it only together with an ADR in docs/adr/.
# Schema reference: .claude/skills/architecture-composition/references/profile-schema.md
# ─────────────────────────────────────────────────────────────────────────────
version: 1
status: active            # draft | active  (agents refuse M/L/XL tasks while draft, except /choose-architecture)

system:
  name: LocalTax
  root_namespace: LocalTax
  topology: modular-monolith        # monolith | modular-monolith | microservices
  runtime: dotnet-10
  frontend: react-ts                # feature-sliced, folders mirror the modules below
  database: sqlserver               # sqlserver | postgresql | ...
  adr: docs/adr/0001-architecture-baseline.md

conventions:
  api_style: minimal-apis           # minimal-apis | controllers
  endpoint_placement: slice         # slice (endpoint lives in the slice) | host (endpoints in API project)
  request_dispatch: direct          # direct (handlers injected) | mediator (only with ADR: needs pipeline behaviors)
  validation: fluentvalidation      # fluentvalidation | data-annotations | manual
  error_model: result               # result (Result<T> + ProblemDetails) | exceptions
  data_access:
    orm: none                   # ef-core | dapper | stored-procedures
    write: dapper                  # ef-core | dapper | stored-procedures
    read: dapper                    # dapper | stored-procedures | ef-core-no-tracking | views
  migrations: dbup                  # numbered T-SQL scripts in db/migrations, journaled by DbUp (ADR-0002)
  time: timeprovider                # inject TimeProvider; never DateTime.Now in domain/app code
  testing:
    unit: xunit
    integration: sqlserver         # instance from database.server; test database LocalTax_Tests (ADR-0003, R-DB-04)
    architecture: netarchtest       # netarchtest | archunitnet

database:
  name: LocalTax
  server: 'VALERIA'           # exact ca în SSMS: localhost, .\SQLEXPRESS, NUME-PC\INSTANTA
  auth: windows               # windows | sql
  migrations_path: db/migrations
  apply: user
  created_by: user            # baza și schema le aplici tu; agenții doar scriu fișiere

shared_kernel:                      # types every module may reference; keep this list tiny
  project: LocalTax.SharedKernel
  allowed: [Result, Error, Money, Cnp, Cui, FiscalYear, "strongly-typed ids base"]

platform:                           # shared, AspNetCore-dependent plumbing (schema v1 extension, ADR-0003)
  - project: LocalTax.Platform.Security
    contains: [Permission, IPermissionCatalog, ICurrentUser, "RequirePermission() endpoint convention"]
    referenced_by: "module feature slices and the API host; no data access, no Identity types, no module types"

modules:
  - name: Access
    purpose: "Owns staff accounts, sign-in sessions, roles as permission bundles and the authentication audit trail."
    subdomain: generic
    recipe: pure-slices
    macro: none
    organization: vertical-slices
    domain_logic: transaction-script
    cqrs: separate-methods
    db_schema: access
    exposes:
      contracts_project: LocalTax.Modules.Access.Contracts
      integration_events: [StaffAccountDisabled]
      queries: [IStaffLookup]
    consumes: []
    skills: []
    notes: "Identity Core + SignInManager with module-internal Dapper stores (no EF Core, R-005); AddAccessModule is the only Identity composition point. The principal carries only user id and security stamp; permissions are registered at startup in LocalTax.Platform.Security and resolved per request from a (userId, grantsVersion) cache after a single-query session check. Lockout blocks sign-in only. Modules never reference Access; attribution flows through ICurrentUser."

  - name: TaxpayerRegister
    purpose: "Owns the identity and fiscal-domicile data of taxpayers (persons, legal entities)."
    subdomain: supporting
    recipe: pure-slices
    macro: none
    organization: vertical-slices
    domain_logic: transaction-script
    cqrs: separate-methods
    db_schema: taxpayers
    exposes:
      contracts_project: LocalTax.Modules.TaxpayerRegister.Contracts
      integration_events: [TaxpayerRegistered, TaxpayerDataChanged]
      queries: [ITaxpayerLookup]
    consumes: []
    skills: []
    notes: "Master data only. CNP/CUI are SharedKernel value objects; no tax rule lives here."

  - name: Taxation
    purpose: "Establishes the annual tax due for each taxpayer's declared taxable matter (buildings, land, vehicles)."
    subdomain: core
    recipe: sliced-domain
    macro: none
    organization: vertical-slices
    domain_logic: domain-model
    cqrs: separate-models
    db_schema: taxation
    exposes:
      contracts_project: LocalTax.Modules.Taxation.Contracts
      integration_events: [TaxAssessed, TaxAssessmentCorrected, TaxExemptionGranted]
      queries: [IAssessmentSummaryQuery]
    consumes: ["TaxpayerRegister.Contracts: ITaxpayerLookup"]
    skills: []
    notes: "Declaration and assessment share one consistency boundary: assessment needs every asset attribute. Rates, zones, ranks and coefficients are legally dated and resolved through TimeProvider, never hardcoded. sliced-domain instead of clean-sliced because the team is 1-3 devs with moderate DDD experience (ADR-0001 records the upgrade path)."

  - name: Receivables
    purpose: "Keeps every taxpayer's fiscal account by posting debits, receipts and penalties in the legally prescribed allocation order."
    subdomain: core
    recipe: sliced-domain
    macro: none
    organization: vertical-slices
    domain_logic: domain-model
    cqrs: separate-models
    db_schema: receivables
    exposes:
      contracts_project: LocalTax.Modules.Receivables.Contracts
      integration_events: [PaymentPosted, ReceiptIssued, ArrearsOverdue]
      queries: [ITaxpayerBalanceQuery]
    consumes:
      - "Taxation: TaxAssessed"
      - "Taxation: TaxAssessmentCorrected"
      - "TaxpayerRegister.Contracts: ITaxpayerLookup"
      - "OnlinePayments: OnlinePaymentConfirmed"
    skills: []
    notes: "Payment allocation order and penalty accrual (majorari de intarziere) are aggregate invariants: never in SQL, endpoints or UI. Amounts are Money over decimal(19,2); every posting is append-only and audited."

  - name: Enforcement
    purpose: "Drives the legal recovery procedure for overdue debts (somatie, titlu executoriu, poprire, sechestru)."
    subdomain: supporting
    recipe: sliced-domain
    macro: none
    organization: vertical-slices
    domain_logic: domain-model
    cqrs: separate-methods
    db_schema: enforcement
    exposes:
      contracts_project: LocalTax.Modules.Enforcement.Contracts
      integration_events: [EnforcementStarted, EnforcementClosed]
      queries: []
    consumes:
      - "Receivables: ArrearsOverdue"
      - "Receivables.Contracts: ITaxpayerBalanceQuery"
      - "TaxpayerRegister.Contracts: ITaxpayerLookup"
    skills: []
    notes: "State machine with statutory deadlines; every transition is guarded, dated and audited. No amount is recomputed here - balances come from Receivables."

  - name: Reporting
    purpose: "Produces the read-only fiscal documents of the city hall (attestation certificates, registers, statutory reports)."
    subdomain: supporting
    recipe: pure-slices
    macro: none
    organization: vertical-slices
    domain_logic: table-module
    cqrs: separate-methods
    db_schema: reporting
    exposes:
      contracts_project: LocalTax.Modules.Reporting.Contracts
      integration_events: [CertificateIssued]
      queries: []
    consumes:
      - "Receivables.Contracts: ITaxpayerBalanceQuery"
      - "Taxation.Contracts: IAssessmentSummaryQuery"
      - "TaxpayerRegister.Contracts: ITaxpayerLookup"
    skills: []
    notes: "Only module allowed to read across schemas, through read-only views (exception on R-002). Its own schema holds just the register of issued documents; it never computes tax or penalty amounts."

  - name: OnlinePayments
    purpose: "Adapts the external payment gateway (Ghiseul.ro) to the internal payment lifecycle."
    subdomain: generic
    recipe: hexagonal-integration
    macro: hexagonal
    organization: vertical-slices
    domain_logic: transaction-script
    cqrs: separate-methods
    db_schema: onlinepayments
    exposes:
      contracts_project: LocalTax.Modules.OnlinePayments.Contracts
      integration_events: [OnlinePaymentConfirmed, OnlinePaymentFailed]
      queries: []
    consumes: ["Receivables.Contracts: ITaxpayerBalanceQuery"]
    skills: []
    notes: "Planned boundary, no slices until the gateway contract exists. Anti-corruption layer: gateway DTOs never leave the adapter."

rules:                              # extra, repo-specific rules; each becomes an architecture test if testable
  - id: R-001
    text: "Modules reference other modules only through their Contracts project."
    enforce: test
  - id: R-002
    text: "No cross-schema joins in write paths. Reporting reads go through the Reporting module views."
    enforce: review
  - id: R-003
    text: "Contracts projects contain only DTOs, event records and query interfaces: no domain types, no Dapper, no EF Core, no AspNetCore."
    enforce: test
  - id: R-004
    text: "In sliced-domain modules the .Domain namespace does not reference .Features, .Infrastructure, Dapper, EF Core or AspNetCore."
    enforce: test
  - id: R-005
    text: "No Entity Framework Core anywhere: data access with Dapper over IDbSession/ISqlConnectionFactory; schema changes only as DbUp scripts."
    enforce: test
  - id: R-006
    text: "Tax assessment, penalty accrual and payment allocation live in the Domain of Taxation/Receivables: never in SQL, endpoints, jobs or UI."
    enforce: review
  - id: R-007
    text: "Rates, coefficients and legal deadlines are stored with an effective period and resolved via TimeProvider; no hardcoded rates and no DateTime.Now/UtcNow."
    enforce: test
  - id: R-008
    text: "Monetary amounts use Money over decimal(19,2); rounding only through SharedKernel rules."
    enforce: test
  - id: R-009
    text: "Authorization only through permission policies; no role-name checks and no [Authorize(Roles = ...)]."
    enforce: test
  - id: R-010
    text: "Only the Access module depends on Microsoft.AspNetCore.Identity / Microsoft.Extensions.Identity.Core types; the host registers the authentication scheme and calls AddAccessModule. Platform.Security contains no data access, no Identity types and no module types."
    enforce: test
  - id: R-011
    text: "Every endpoint mapped under /api/** carries authorization metadata unless listed on the explicit anonymous allow-list (sign-in, antiforgery, health); static files and the SPA fallback are anonymous."
    enforce: test
  - id: R-012
    text: "Every POST/PUT/PATCH/DELETE endpoint validates an antiforgery token explicitly, JSON endpoints included."
    enforce: test
  - id: R-013
    text: "While MustChangePassword is set, only /api/access/me, /api/access/change-password and /api/access/sign-out succeed; every other endpoint returns 403."
    enforce: test
  - id: R-014
    text: "The claims principal carries only user id and security stamp; authorization never reads role or permission claims from the principal."
    enforce: test
  - id: R-DB-01
    text: "Agents never create, drop or migrate databases and never run sqlcmd, Invoke-Sqlcmd or dotnet ef database update. They only write migration/SQL files; the user applies them."
    enforce: review
  - id: R-DB-02
    text: "Connection strings containing passwords never go into committed files; use user-secrets."
    enforce: review
  - id: R-DB-03
    text: "The application connects with a dedicated least-privilege SQL login (never db_owner or sysadmin) so that DENY UPDATE, DELETE on access.AuthAudit is effective; the retention job uses a separate maintenance login."
    enforce: review
  - id: R-DB-04
    text: "Exception to R-DB-01: the integration test fixture may apply DbUp scripts and reset data only on a database whose name ends with _Tests (guard in code, test fails otherwise). The user creates that database; agents never create or drop it."
    enforce: test

exceptions:
  - { rule: R-002, scope: "Reporting (read-only views over other schemas)", adr: docs/adr/0001-architecture-baseline.md, expires: null }
  - { rule: R-DB-01, scope: "integration test fixture on databases named *_Tests (R-DB-04)", adr: docs/adr/0003-staff-authentication-and-authorization.md, expires: null }

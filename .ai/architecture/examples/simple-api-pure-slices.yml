# Example: small internal API / PWA backend. Deliberately minimal — Clean would be ceremony here.
version: 1
status: active
system:
  name: VinylTracker
  root_namespace: VinylTracker
  topology: monolith
  runtime: dotnet-10
  frontend: none
  database: sqlserver
  adr: docs/adr/0001-architecture-baseline.md
conventions:
  api_style: minimal-apis
  endpoint_placement: slice
  request_dispatch: direct
  validation: manual
  error_model: result
  data_access: { write: dapper, read: dapper }
  migrations: dbup
  time: timeprovider
  testing: { unit: xunit, integration: testcontainers, architecture: netarchtest }
shared_kernel: { project: VinylTracker, allowed: [Result] }
modules:
  - name: Catalog
    purpose: "Records, pressings, purchase log."
    subdomain: supporting
    recipe: pure-slices
    macro: none
    organization: vertical-slices
    domain_logic: transaction-script
    cqrs: separate-methods
    db_schema: dbo
    exposes: { contracts_project: null, integration_events: [], queries: [] }
    consumes: []
rules: []
exceptions: []
